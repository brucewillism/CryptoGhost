# CryptoGhost - Docker Compose v2
# Plataforma de Inteligência Financeira com IA Explicável

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cryptoghost-postgres
    environment:
      POSTGRES_USER: cryptoghost
      POSTGRES_PASSWORD: cryptoghost
      POSTGRES_DB: cryptoghost
    volumes:
      - cryptoghost_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoghost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptoghost-net

  redis:
    image: redis:7-alpine
    container_name: cryptoghost-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cryptoghost-net

  ollama:
    image: ollama/ollama:latest
    container_name: cryptoghost-ollama
    ports:
      - "11434:11434"
    volumes:
      - cryptoghost_ollama:/root/.ollama
    networks:
      - cryptoghost-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cryptoghost-backend
    env_file:
      - .env
    environment:
      CRYPTOGHOST_DATABASE_URL: postgresql+asyncpg://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_DATABASE_URL_SYNC: postgresql://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_REDIS_URL: redis://redis:6379/0
      CRYPTOGHOST_CELERY_BROKER_URL: redis://redis:6379/1
      CRYPTOGHOST_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CRYPTOGHOST_OLLAMA_BASE_URL: http://ollama:11434
      CRYPTOGHOST_AI_PROVIDER_DEFAULT: ollama
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - cryptoghost_models:/app/models
    networks:
      - cryptoghost-net
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cryptoghost-celery-worker
    command: celery -A backend.shared.celery_app worker --loglevel=info -Q celery
    env_file:
      - .env
    environment:
      CRYPTOGHOST_DATABASE_URL: postgresql+asyncpg://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_DATABASE_URL_SYNC: postgresql://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_REDIS_URL: redis://redis:6379/0
      CRYPTOGHOST_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app/backend
      - cryptoghost_models:/app/models
    networks:
      - cryptoghost-net
    restart: unless-stopped

  celery-ai-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cryptoghost-celery-ai-worker
    command: celery -A backend.shared.celery_app worker --loglevel=info -Q intelligence,analysis -c 2
    env_file:
      - .env
    environment:
      CRYPTOGHOST_DATABASE_URL: postgresql+asyncpg://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_DATABASE_URL_SYNC: postgresql://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_REDIS_URL: redis://redis:6379/0
      CRYPTOGHOST_CELERY_BROKER_URL: redis://redis:6379/1
      CRYPTOGHOST_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - backend
      - redis
      - ollama
    volumes:
      - ./backend:/app/backend
      - cryptoghost_models:/app/models
    networks:
      - cryptoghost-net
    restart: unless-stopped

  celery-worker-v6:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cryptoghost-celery-v6
    command: celery -A backend.shared.celery_app worker --loglevel=info -Q market_scan,backtesting,retraining -c 2
    env_file:
      - .env
    environment:
      CRYPTOGHOST_DATABASE_URL: postgresql+asyncpg://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_DATABASE_URL_SYNC: postgresql://cryptoghost:cryptoghost@postgres:5432/cryptoghost
      CRYPTOGHOST_REDIS_URL: redis://redis:6379/0
      CRYPTOGHOST_CELERY_BROKER_URL: redis://redis:6379/1
      CRYPTOGHOST_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app/backend
      - cryptoghost_models:/app/models
    networks:
      - cryptoghost-net
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cryptoghost-celery-beat
    command: celery -A backend.shared.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      CRYPTOGHOST_CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - celery-worker
      - celery-worker-v6
    volumes:
      - ./backend:/app/backend
    networks:
      - cryptoghost-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cryptoghost-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    networks:
      - cryptoghost-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cryptoghost-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - cryptoghost-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cryptoghost-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cryptoghost
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - cryptoghost_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cryptoghost-net

volumes:
  cryptoghost_pg_data:
  cryptoghost_grafana_data:
  cryptoghost_models:
  cryptoghost_ollama:

networks:
  cryptoghost-net:
    driver: bridge
